# Datasource configuration for local development
spring.datasource.url=jdbc:postgresql://localhost:5432/studentsupportdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DEV_DB_USERNAME:postgres}
spring.datasource.password=${DEV_DB_PASSWORD:postgres}

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / SpringDoc configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# JWT configuration for local development only
jwt.secret=${DEV_JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-minimum-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Logging configuration for development
logging.level.com.studentsupport=DEBUG
logging.level.org.springframework.security=DEBUG