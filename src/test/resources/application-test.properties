# Isolated in-memory H2 database for tests - never touches the real dev/prod database.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-only-secret-key-not-for-production-use-32-bytes-minimum
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=2592000000

app.frontend-url=http://localhost:5173
app.upload.dir=target/test-uploads

gemini.api.key=
gemini.model=gemini-flash-latest

# Fails fast (connection refused) instead of reaching out to a real SMTP server
# EmailService already catches send failures, so this just keeps tests fast and offline.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=

app.seed-admin.email=
app.seed-admin.password=
